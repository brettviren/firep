# Weighting potential for the central collection wire, with 21 wires per plane.
#
#   firep train -c examples/weighting-2d-21wire.yaml -o weight.pt
#   firep sample weight.pt -o weight.npz --nx 841 --ny 441
#   firep plot weight.npz -o weight.png --contours 30 --log
#
# Every conductor and both faces are held at 0 V except the one sensing wire,
# which is held at 1 V.  The transverse period is now 21 pitches, so the
# periodic boundary sits 10.5 pitches from the sensing wire.
version: 1
name: lartpc-2d-21wire-weighting

domain:
  dimension: 2
  bounds:
    x: [-52.5, 52.5]       # 21 x 5 mm
    y: [-10.0, 100.0]
  boundaries:
    x: {type: periodic}
    ylo: {type: dirichlet, role: ground,  potential: 0.0}
    yhi: {type: dirichlet, role: cathode, potential: auto}

electrodes:
  - {name: u, kind: wire, role: induction,  plane: 10.0,
     shape: {radius: 0.075}, lattice: {pitch: 5.0, count: 21}}
  - {name: v, kind: wire, role: induction,  plane: 5.0,
     shape: {radius: 0.075}, lattice: {pitch: 5.0, count: 21}}
  - {name: w, kind: wire, role: collection, plane: 0.0,
     shape: {radius: 0.075}, lattice: {pitch: 5.0, count: 21}}

problem:
  kind: weighting
  weighting:
    electrode: w
    index: null            # null selects the central wire (index 10 of 21)
    unit: 1.0

sampling:
  n_bulk: 8192             # 63 conductors need more points than 3 do
  n_near: 8192
  n_surface: 128

grid: {nx: 841, ny: 441}
